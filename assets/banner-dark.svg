<svg xmlns="http://www.w3.org/2000/svg" width="960" height="236" viewBox="0 0 960 236" role="img" aria-labelledby="t d">
  <title id="t">Nicolas Xavier — Desenvolvedor de Software Júnior</title>
  <desc id="d">Desenvolvimento web e APIs REST. Manaus, AM.</desc>
  <style>
    text{font-family:'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif}
    .enter{animation:enter 1.6s cubic-bezier(.2,.7,.2,1) both;transform-origin:790px 118px;transform-box:view-box}
    .s1{animation:spin 120s linear infinite;transform-origin:790px 118px;transform-box:view-box}
    .s2{animation:spin 180s linear infinite reverse;transform-origin:790px 118px;transform-box:view-box}
    .s3{animation:spin 70s linear infinite;transform-origin:790px 118px;transform-box:view-box}
    .breathe{animation:breathe 9s ease-in-out infinite;transform-origin:790px 118px;transform-box:view-box}
    @keyframes enter{from{opacity:.45;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes breathe{0%,100%{opacity:.85}50%{opacity:1}}
    @media (prefers-reduced-motion: reduce){*{animation:none !important}}
  </style>
  <defs>
    <radialGradient id="glow" cx="790" cy="118" r="184" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#65C7FF" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#65C7FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#65C7FF"/>
      <stop offset="1" stop-color="#9075DB"/>
    </linearGradient>
    <clipPath id="clip"><rect width="960" height="236" rx="16"/></clipPath>
  </defs>
  <rect width="960" height="236" rx="16" fill="#0B1020"/>
  <g clip-path="url(#clip)">
    <g class="enter">
      <circle cx="790" cy="118" r="184" fill="url(#glow)" class="breathe"/>
      <circle cx="790" cy="118" r="36" fill="none" stroke="#65C7FF" stroke-opacity="1" stroke-width="1.6"/>
      <circle cx="790" cy="118" r="72" fill="none" stroke="#65C7FF" stroke-opacity="0.82" stroke-width="1.6"/>
      <circle cx="790" cy="118" r="108" fill="none" stroke="#65C7FF" stroke-opacity="0.6" stroke-width="1.6"/>
      <circle cx="790" cy="118" r="144" fill="none" stroke="#65C7FF" stroke-opacity="0.42" stroke-width="1.6"/>
      <g class="s1"><circle cx="790" cy="118" r="102" fill="none" stroke="#9075DB" stroke-width="2" stroke-linecap="round" stroke-dasharray="141.0 499.9"/></g>
      <g class="s2"><circle cx="790" cy="118" r="154" fill="none" stroke="#65C7FF" stroke-opacity="0.85" stroke-width="2" stroke-linecap="round" stroke-dasharray="116.1 851.5"/></g>
      <g class="s3"><circle cx="862" cy="118" r="3.5" fill="#BDDFFF"/></g>
      <circle cx="790" cy="118" r="3" fill="#65C7FF"/>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="959" height="235" rx="16" fill="none" stroke="#1B2A4A"/>
  <rect x="56" y="50" width="48" height="3" rx="1.5" fill="url(#rule)"/>
  <text x="56" y="112" font-size="58" font-weight="700" fill="#F4F7FB" letter-spacing="-1">Nicolas Xavier</text>
  <text x="56" y="158" font-size="27" font-weight="500" fill="#65C7FF">Desenvolvedor de Software Júnior</text>
  <text x="56" y="198" font-size="19" fill="#BDDFFF">Desenvolvimento web e APIs REST · Manaus, AM</text>
</svg>
