<svg xmlns="http://www.w3.org/2000/svg" width="420" height="330" viewBox="0 0 420 330" role="img" aria-labelledby="t d">
  <title id="t">Nicolas Xavier — Desenvolvedor de Software Júnior</title>
  <desc id="d">Desenvolvimento web e APIs REST. Manaus, AM.</desc>
  <style>
    text{font-family:'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif}
    .enter{animation:enter 1.6s cubic-bezier(.2,.7,.2,1) both;transform-origin:330px 70px;transform-box:view-box}
    .s1{animation:spin 120s linear infinite;transform-origin:330px 70px;transform-box:view-box}
    .s2{animation:spin 180s linear infinite reverse;transform-origin:330px 70px;transform-box:view-box}
    .s3{animation:spin 70s linear infinite;transform-origin:330px 70px;transform-box:view-box}
    .breathe{animation:breathe 9s ease-in-out infinite;transform-origin:330px 70px;transform-box:view-box}
    @keyframes enter{from{opacity:.45;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes breathe{0%,100%{opacity:.85}50%{opacity:1}}
    *{animation:none !important}
  </style>
  <defs>
    <radialGradient id="glow" cx="330" cy="70" r="152" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#65C7FF" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#65C7FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#65C7FF"/>
      <stop offset="1" stop-color="#9075DB"/>
    </linearGradient>
    <clipPath id="clip"><rect width="420" height="330" rx="16"/></clipPath>
  </defs>
  <rect width="420" height="330" rx="16" fill="#0B1020"/>
  <g clip-path="url(#clip)">
    <g class="enter">
      <circle cx="330" cy="70" r="152" fill="url(#glow)" class="breathe"/>
      <circle cx="330" cy="70" r="28" fill="none" stroke="#65C7FF" stroke-opacity="1" stroke-width="1.6"/>
      <circle cx="330" cy="70" r="56" fill="none" stroke="#65C7FF" stroke-opacity="0.82" stroke-width="1.6"/>
      <circle cx="330" cy="70" r="84" fill="none" stroke="#65C7FF" stroke-opacity="0.6" stroke-width="1.6"/>
      <circle cx="330" cy="70" r="112" fill="none" stroke="#65C7FF" stroke-opacity="0.42" stroke-width="1.6"/>
      <g class="s1"><circle cx="330" cy="70" r="78" fill="none" stroke="#9075DB" stroke-width="2" stroke-linecap="round" stroke-dasharray="107.8 382.3"/></g>
      <g class="s2"><circle cx="330" cy="70" r="122" fill="none" stroke="#65C7FF" stroke-opacity="0.85" stroke-width="2" stroke-linecap="round" stroke-dasharray="92.0 674.6"/></g>
      <g class="s3"><circle cx="386" cy="70" r="3.5" fill="#BDDFFF"/></g>
      <circle cx="330" cy="70" r="3" fill="#65C7FF"/>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="419" height="329" rx="16" fill="none" stroke="#1B2A4A"/>
  <rect x="28" y="112" width="48" height="3" rx="1.5" fill="url(#rule)"/>
  <text x="28" y="168" font-size="42" font-weight="700" fill="#F4F7FB" letter-spacing="-1">Nicolas Xavier</text>
  <text x="28" y="212" font-size="22" font-weight="500" fill="#65C7FF">Desenvolvedor de Software Júnior</text>
  <text x="28" y="246" font-size="16" fill="#BDDFFF">Desenvolvimento web e APIs REST</text>
  <text x="28" y="270" font-size="16" fill="#BDDFFF">Manaus, AM</text>
</svg>
